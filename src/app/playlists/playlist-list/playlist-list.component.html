@if (playlists$ | async; as playlists) {
  @if (!this.media.isActive('xs')) {
    <mat-card>
      <mat-card-content>
        <div>
          <mat-slide-toggle color="primary" hideIcon (change)="setAllActive($event)">
            Select all
          </mat-slide-toggle>
        </div>
        @for (playlist of playlists; track playlist.id) {
          <div>
            <app-playlist-view [playlist]="playlist"></app-playlist-view>
          </div>
        }
      </mat-card-content>
    </mat-card>
  } @else {
    <div fxFlexFill id="playlists">
      <div class="margins">
        <mat-slide-toggle color="primary" hideIcon (change)="setAllActive($event)">
          Select all
        </mat-slide-toggle>
      </div>
      @for (playlist of playlists; track playlist.id) {
        <div class="playlist">
          <app-playlist-view [playlist]="playlist"></app-playlist-view>
        </div>
      }
    </div>
  }
}
