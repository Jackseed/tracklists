@if (playlists$ | async; as playlists) {
  @if (!this.media.isActive('xs')) {
    <div class="list">
      <div class="select-all">
        <mat-slide-toggle hideIcon (change)="setAllActive($event)">Select all</mat-slide-toggle>
      </div>
      @for (playlist of playlists; track playlist.id) {
        <app-playlist-view [playlist]="playlist"></app-playlist-view>
      }
    </div>
  } @else {
    <div fxFlexFill id="playlists">
      <div class="select-all">
        <mat-slide-toggle hideIcon (change)="setAllActive($event)">Select all</mat-slide-toggle>
      </div>
      @for (playlist of playlists; track playlist.id) {
        <div class="playlist">
          <app-playlist-view [playlist]="playlist"></app-playlist-view>
        </div>
      }
    </div>
  }
}
