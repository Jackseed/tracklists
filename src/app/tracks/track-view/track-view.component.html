@if (!this.media.isActive('xs')) {
  <div class="track" [class.playing]="isPlaying$ | async">
    <div class="cover" [style.background-image]="cover"></div>
    <div class="text">
      <p class="title" [title]="track.name">{{ track.name }}</p>
      <p class="artist">{{ track.artists?.[0]?.name }}</p>
    </div>
    <div class="actions">
      @if (isLiked$ | async) {
        <button class="tl-icon-btn tl-icon-btn--small is-on" (click)="unlike()" matTooltip="Unlike" aria-label="Unlike">
          <mat-icon class="tl-filled">favorite</mat-icon>
        </button>
      } @else {
        <button class="tl-icon-btn tl-icon-btn--small" (click)="like()" matTooltip="Like" aria-label="Like">
          <mat-icon>favorite</mat-icon>
        </button>
      }
      <button class="tl-icon-btn tl-icon-btn--small" (click)="play()" matTooltip="Play" aria-label="Play">
        <mat-icon class="tl-filled">play_arrow</mat-icon>
      </button>
      <button class="tl-icon-btn tl-icon-btn--small" (click)="addoToPlayback()" matTooltip="Add to queue" aria-label="Add to queue">
        <mat-icon>playlist_add</mat-icon>
      </button>
      <button class="tl-icon-btn tl-icon-btn--small" (click)="remove()" matTooltip="Remove from tracklist" aria-label="Remove from tracklist">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>
} @else {
  <div class="track mobile" (click)="play()">
    <div class="cover" [style.background-image]="cover"></div>
    <div class="text">
      <p class="title" [class.active]="isPlaying$ | async">{{ track.name }}</p>
      <p class="artist">{{ track.artists?.[0]?.name }}</p>
    </div>
  </div>
}
