@if (!this.media.isActive('xs')) {
  <mat-card class="track" [class.playing]="isPlaying$ | async">
    <div class="cover" [style.background-image]="cover"></div>
    <div class="text">
      <mat-card-title class="title" [title]="track.name">{{ track.name }}</mat-card-title>
      <mat-card-subtitle class="artist">{{ track.artists?.[0]?.name }}</mat-card-subtitle>
    </div>
    <div class="actions">
      @if (isLiked$ | async) {
        <button mat-icon-button (click)="unlike()" matTooltip="Unlike" aria-label="Unlike">
          <mat-icon>favorite</mat-icon>
        </button>
      } @else {
        <button mat-icon-button (click)="like()" matTooltip="Like" aria-label="Like">
          <mat-icon>favorite_border</mat-icon>
        </button>
      }
      <button mat-icon-button (click)="play()" matTooltip="Play" aria-label="Play">
        <mat-icon>play_circle_outline</mat-icon>
      </button>
      <button mat-icon-button (click)="addoToPlayback()" matTooltip="Add to queue" aria-label="Add to queue">
        <mat-icon>playlist_add</mat-icon>
      </button>
      <button mat-icon-button (click)="remove()" matTooltip="Remove from tracklist" aria-label="Remove from tracklist">
        <mat-icon>cancel</mat-icon>
      </button>
    </div>
  </mat-card>
} @else {
  <div class="track mobile" (click)="play()">
    <div class="cover" [style.background-image]="cover"></div>
    <div class="text">
      <p class="title" [class.active]="isPlaying$ | async">{{ track.name }}</p>
      <p class="artist">{{ track.artists?.[0]?.name }}</p>
    </div>
  </div>
}
