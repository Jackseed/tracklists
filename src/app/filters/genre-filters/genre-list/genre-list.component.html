<div class="margin-top">
  <h4>Genres</h4>
  <form>
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="genres-field tl-field">
      <mat-label>Pop, rock, rap,..</mat-label>
      <mat-chip-grid #chipGrid aria-label="Selected genres">
        @for (activeGenre of activeGenres$ | async; track activeGenre.id) {
          <mat-chip-row (removed)="remove(activeGenre.id)">
            {{ activeGenre.id }} ({{ activeGenre.trackIds.length }})
            <button matChipRemove [attr.aria-label]="'Remove ' + activeGenre.id">
              <mat-icon>close</mat-icon>
            </button>
          </mat-chip-row>
        }
        <input
          #genreInput
          type="text"
          placeholder="Genres"
          aria-label="Genres"
          [formControl]="genreControl"
          [matAutocomplete]="auto"
          [matChipInputFor]="chipGrid"
          [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
          (matChipInputTokenEnd)="add($event)"
        />
      </mat-chip-grid>
      <mat-autocomplete
        #auto="matAutocomplete"
        (optionSelected)="selected($event)"
      >
        @for (genre of filteredGenres$ | async; track genre.id) {
          <mat-option [value]="genre">
            {{ genre.id }} ({{ genre.trackIds.length }})
          </mat-option>
        }
      </mat-autocomplete>
    </mat-form-field>
  </form>
</div>
