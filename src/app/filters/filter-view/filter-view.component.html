<div class="filter" [class.tl-filter-idle]="!active">
  <div class="head">
    <span class="label">{{ filter.label }}</span>
    <span class="value" [class.on]="active">{{ active ? valueText : 'Any' }}</span>
  </div>
  <div class="row">
    <mat-icon class="end" [class.lit]="rangeValues[0] > filter.extremeValues.min" [matTooltip]="filter.min">{{ filter.minIcon }}</mat-icon>
    <nz-slider
      class="slider"
      nzRange
      [nzMin]="filter.extremeValues.min"
      [nzMax]="filter.extremeValues.max"
      [nzStep]="filter.step"
      [nzTipFormatter]="null"
      [ngModel]="rangeValues"
      (ngModelChange)="onChange($event)"
      [attr.aria-label]="filter.label"
    ></nz-slider>
    <mat-icon class="end" [class.lit]="rangeValues[1] < filter.extremeValues.max" [matTooltip]="filter.max">{{ filter.maxIcon }}</mat-icon>
  </div>
</div>
