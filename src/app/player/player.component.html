@if (track$ | async; as track) {
  <mat-card class="player">
    <!-- Now playing -->
    <div class="now-playing">
      <div class="cover" [style.background-image]="cover(track)"></div>
      <div class="text">
        <mat-card-title class="title" [title]="track.name">{{ track.name }}</mat-card-title>
        <mat-card-subtitle class="artist">{{ track.artists?.[0]?.name }}</mat-card-subtitle>
      </div>
    </div>

    <!-- Controls and position -->
    <div class="center">
      <div class="controls">
        <button mat-icon-button class="secondary hide-xs" (click)="shuffle()" [class.on]="shuffle$ | async" aria-label="Shuffle">
          <mat-icon svgIcon="shuffle"></mat-icon>
        </button>
        <button mat-icon-button class="secondary hide-xs" (click)="previous()" aria-label="Previous">
          <mat-icon>skip_previous</mat-icon>
        </button>
        @if (paused$ | async) {
          <button mat-icon-button class="main" (click)="play()" aria-label="Play">
            <mat-icon>play_circle</mat-icon>
          </button>
        } @else {
          <button mat-icon-button class="main" (click)="pause()" aria-label="Pause">
            <mat-icon>pause_circle</mat-icon>
          </button>
        }
        <button mat-icon-button class="secondary" (click)="next()" aria-label="Next">
          <mat-icon>skip_next</mat-icon>
        </button>
        @if (isLiked$ | async) {
          <button mat-icon-button class="secondary" (click)="like(false)" matTooltip="Unlike" aria-label="Unlike">
            <mat-icon>favorite</mat-icon>
          </button>
        } @else {
          <button mat-icon-button class="secondary" (click)="like(true)" matTooltip="Like" aria-label="Like">
            <mat-icon>favorite_border</mat-icon>
          </button>
        }
      </div>
      <div class="position hide-xs">
        <span class="time">{{ value | secToMin }}</span>
        <mat-slider class="slider" color="accent" min="0" [max]="track.duration_ms / 1000">
          <input
            matSliderThumb
            aria-label="Position in the track"
            [(ngModel)]="value"
            (change)="onChangeSlider()"
          />
        </mat-slider>
        <span class="time">{{ track.duration_ms / 1000 | secToMin }}</span>
      </div>
    </div>

    <!-- Balances the layout so that the controls stay centred. -->
    <div class="spacer hide-xs"></div>
  </mat-card>
}
