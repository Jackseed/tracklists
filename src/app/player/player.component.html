@if (track$ | async; as track) {
  <div class="player tl-panel">
    <!-- Now playing -->
    <div class="now-playing">
      <div class="cover" [style.background-image]="cover(track)"></div>
      <div class="text">
        <p class="title" [title]="track.name">{{ track.name }}</p>
        <p class="artist">{{ track.artists?.[0]?.name }}</p>
      </div>
    </div>

    <!-- Controls and position -->
    <div class="center">
      <div class="controls">
        <button class="tl-icon-btn hide-xs" (click)="shuffle()" [class.is-on]="shuffle$ | async" aria-label="Shuffle">
          <mat-icon>shuffle</mat-icon>
        </button>
        <button class="tl-icon-btn hide-xs" (click)="previous()" aria-label="Previous">
          <mat-icon class="tl-filled">skip_previous</mat-icon>
        </button>
        @if (paused$ | async) {
          <button class="play-pause" (click)="play()" aria-label="Play">
            <mat-icon class="tl-filled">play_arrow</mat-icon>
          </button>
        } @else {
          <button class="play-pause" (click)="pause()" aria-label="Pause">
            <mat-icon class="tl-filled">pause</mat-icon>
          </button>
        }
        <button class="tl-icon-btn" (click)="next()" aria-label="Next">
          <mat-icon class="tl-filled">skip_next</mat-icon>
        </button>
        @if (isLiked$ | async) {
          <button class="tl-icon-btn is-on" (click)="like(false)" matTooltip="Unlike" aria-label="Unlike">
            <mat-icon class="tl-filled">favorite</mat-icon>
          </button>
        } @else {
          <button class="tl-icon-btn" (click)="like(true)" matTooltip="Like" aria-label="Like">
            <mat-icon>favorite</mat-icon>
          </button>
        }
      </div>
      <div class="position hide-xs">
        <span class="time">{{ value | secToMin }}</span>
        <mat-slider class="slider" min="0" [max]="track.duration_ms / 1000">
          <input
            matSliderThumb
            aria-label="Position in the track"
            [(ngModel)]="value"
            (change)="onChangeSlider()"
          />
        </mat-slider>
        <span class="time">{{ track.duration_ms / 1000 | secToMin }}</span>
      </div>
    </div>

    <!-- Balances the layout so that the controls stay centred. -->
    <div class="spacer hide-xs"></div>
  </div>
}
