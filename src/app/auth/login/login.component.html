<div fxFlexFill fxLayout="column" fxLayoutAlign="start center">
  <div fxFlexFill fxLayoutAlign="center center">
    <div id="logo">
      <h1><a id="logo-text" class="white" href="">Tracklists</a></h1>
    </div>
    <div fxFlex class="text-centered text">
      <h1>Log in to Spotify</h1>
      <p class="bigger">You need to be connected to load your songs.</p>
      @if (error) {
        <p class="bigger error" id="login-error">{{ error }}</p>
      }
      <div>
        <button
          mat-raised-button
          color="accent"
          id="login-button"
          (click)="loginToSpotify()"
          [disabled]="loggingIn"
        >
          @if (!loggingIn) {
            <span>Login</span>
          } @else {
            <div fxLayout="row" fxLayoutAlign="center center">
              Logging in...
              <mat-spinner
                diameter="16"
                class="margin-left"
                color="accent"
              ></mat-spinner>
            </div>
          }
        </button>
      </div>
    </div>
  </div>
</div>
